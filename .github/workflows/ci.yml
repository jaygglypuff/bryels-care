# Every push and pull request must type-check, carry a migration for every schema change,
# pass the integration suite on a real PostgreSQL and build (ADR-013, backlog E-1-01).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, migrations, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bryels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bryels_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bryels_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          git status --porcelain src/db/migrations
          test -z "$(git status --porcelain src/db/migrations)" || { echo "Schema changed without a committed migration. Run pnpm db:generate."; exit 1; }

      - name: Integration tests (real PostgreSQL)
        run: pnpm test

      - name: Production build
        run: pnpm build
